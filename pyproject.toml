[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bugnet"
version = "0.1.0"
description = "An audit of a system's own account of itself: completeness and reconciliation checks against an outside source of truth."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jacob King" }]
keywords = ["monitoring", "reconciliation", "data-quality", "observability", "completeness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.urls]
Source = "https://github.com/JakeKing-Dev/bugnet"

[tool.setuptools.packages.find]
include = ["bugnet*"]
